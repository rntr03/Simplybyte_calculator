

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  gap: 30px;
  flex-wrap: wrap;
}
.calculator, .history {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
#result {
  width: 100%;
  height: 50px;
  font-size: 1.5rem;
  text-align: right;
  padding-right: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 60px);
  gap: 10px;
}
.buttons button {
  height: 60px;
  font-size: 1.2rem;
  border: none;
  border-radius: 6px;
  background: #e0e0e0;
  cursor: pointer;
}
.buttons button.operator {
  background: #ff9800;
  color: white;
}
.buttons button.equal {
  background: #4caf50;
  color: white;
  grid-column: span 2;
}
.buttons button.clear {
  background: #f44336;
  color: white;
  grid-column: span 2;
}
.history {
  width: 230px;
  min-height: 200px;
}
.history button {
  background: #f44336;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 5px;
  cursor: pointer;
}
#historyList {
  padding-left: 20px;
}
#historyList li {
  margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="calculator">
  <h2>Simple Calculator</h2>
  <input type="text" id="result" disabled>
  <div class="buttons">
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('/')">÷</button>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('*')">×</button>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('-')">−</button>
    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
    <button class="operator" onclick="appendValue('+')">+</button>
    <button class="clear" onclick="clearResult()">C</button>
  </div>
</div>

<div class="history">
  <h2>Calculation History</h2>
  <ul id="historyList">
    <li>No calculations yet</li>
  </ul>
  <button onclick="clearHistory()">Clear History</button>
</div>

<script>
const result = document.getElementById('result');

function appendValue(val) {
  if (result.value === 'Error') result.value = '';
  result.value += val;
}

function calculate() {
  try {
    const expression = result.value;
    if (expression === '') return;

    const answer = eval(expression);

    if (typeof answer !== 'number' || !Number.isFinite(answer)) {
      result.value = 'Error';
      return;
    }

    result.value = answer;
    addHistory(expression, answer);
  } catch {
    result.value = 'Error';
  }
}

function clearResult() {
  result.value = '';
}

function addHistory(expression, answer) {
  const historyList = document.getElementById('historyList');

  if (historyList.children.length === 1 &&
      historyList.children[0].textContent === 'No calculations yet') {
    historyList.innerHTML = '';
  }

  const item = document.createElement('li');
  item.textContent = expression + ' = ' + answer;
  historyList.appendChild(item);
}

function clearHistory() {
  document.getElementById('historyList').innerHTML =
    '<li>No calculations yet</li>';
}
</script>

</body>
</html>
